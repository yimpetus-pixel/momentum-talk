<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>모멘텀 발표 노트</title>
<style>
  /* 아이폰 한 손 노트: 한 화면에 한 장, 큰 글씨, 아래쪽 큰 버튼. 덱과 같은 검정·주황 톤(단일 다크 디자인) */
  :root{color-scheme:dark;
    --bg:#000;--panel:#0E0E0E;--rule:#2B2B2B;--fg:#ECECEC;--muted:#8E8E8E;--dim:#5A5A5A;--orange:#FF9F1A;--up:#FF4D4D;--down:#5AA9FF;
    --sans:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;padding-inline:18px;padding-block:0;-webkit-text-size-adjust:100%}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
  .top .t{color:var(--muted);font-variant-numeric:tabular-nums}
  .top button{font:inherit;color:var(--orange);background:none;border:1px solid var(--rule);padding:4px 10px;letter-spacing:.1em}
  main{flex:1;min-height:0;overflow:auto;padding-block:16px 8px}
  .title{font-size:15px;color:var(--muted);margin:0 0 4px;font-family:var(--mono);letter-spacing:.06em}
  h1{font-size:22px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
  h1 em{font-style:normal;color:var(--orange)}
  .note p{font-size:20px;line-height:1.62;margin:0 0 12px}
  .note b{color:var(--orange);font-weight:600}
  .note .q{border-left:3px solid var(--rule);padding-left:12px;color:#d8d8d8}
  .note .q.up{border-color:var(--up)} .note .q.dn{border-color:var(--down)}
  .cue{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em;margin-top:6px}
  nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
  nav button{font:inherit;font-size:17px;font-weight:600;padding:16px 0;background:var(--panel);color:var(--fg);border:1px solid var(--rule);min-height:56px}
  nav button.next{background:var(--orange);color:#000;border-color:var(--orange)}
  nav button:disabled{opacity:.35}
  nav button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){.note{animation:in .18s ease-out}}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="top"><span>장 <span id="pg">07 / 13</span></span><span class="t" id="clock">00:00</span><button id="tbtn" type="button">시작</button></div>
<main>
  <p class="title" id="sec">03 · 토론 한 장면 · 1분 30초</p>
  <h1 id="h">유가 하나를 두고, <em>정반대로</em> 읽었습니다</h1>
  <div class="note" id="note"></div>
</main>
<nav><button id="prev" type="button">← 이전</button><button id="next" class="next" type="button">다음 →</button></nav>

<script>
// 예시: 7번 한 장만. 실제 덱은 13장이 모두 들어간다(덱 HTML 과 같은 원고를 쓴다).
const slides=[
 {sec:"03 · 토론 한 장면 · 1분 30초", h:'유가 하나를 두고, <em>정반대로</em> 읽었습니다', n:[
  '<b>유가 하나를 두고 두 AI가 정반대로 읽었습니다.</b> 둘 다 사실인데, 비교 기준이 달랐습니다.',
  '<span class="q up">상승론자 Claude: 9월 호르무즈 해협 공격 뒤 유가가 배럴당 107달러까지 뛰었다. 그래서 물가가 오른다.</span>',
  '<span class="q dn">하락론자 Codex: 물가에 반영된 유가는 아직 5월보다 9% 낮다. 끌어올릴 힘은 제한적이다.</span>',
  '상승론자는 지난달과, 하락론자는 유가가 높았던 5월과 비교했습니다. 어느 기간을 보느냐에 따라 결론이 달라지는 <b>데이터 바이어스</b>가 바로 이 장면입니다.',
  '심판은 숫자와 날짜가 더 구체적인 상승 쪽에 <b>8점</b>, 하락 쪽에 <b>6점</b>을 줬습니다. 제가 원한 것이 이것입니다. 한 AI가 양쪽을 얼버무리는 대신, 각자 끝까지 밀고 심판이 따로 판단하는 구조입니다.',
  '<span class="cue">다음 장 → 미국 CPI, AI 팀의 답</span>']}
];
const total=13, base=7; // 예시: 실제 번호는 7번부터
let i=0; try{i=Math.min(slides.length-1,parseInt(localStorage.getItem('fxd-note-i')||'0')||0)}catch(e){}
const pad=n=>String(n).padStart(2,'0');
function render(){const s=slides[i];document.getElementById('sec').textContent=s.sec;document.getElementById('h').innerHTML=s.h;
 const el=document.getElementById('note');el.innerHTML=s.n.map(p=>`<p>${p}</p>`).join('');el.style.animation='none';void el.offsetWidth;el.style.animation='';
 document.getElementById('pg').textContent=`${pad(base+i)} / ${pad(total)}`;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;
 try{localStorage.setItem('fxd-note-i',String(i))}catch(e){}
 document.querySelector('main').scrollTop=0;}
document.getElementById('prev').onclick=()=>{if(i>0){i--;render();}};
document.getElementById('next').onclick=()=>{if(i<slides.length-1){i++;render();}};
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)(dx<0?document.getElementById('next'):document.getElementById('prev')).click();tx=null;});
// 경과 시간 + 화면 꺼짐 방지(허용되면)
let t0=null,timer=null;const tb=document.getElementById('tbtn');
tb.onclick=()=>{if(t0){clearInterval(timer);t0=null;tb.textContent='시작';return;}t0=Date.now();tb.textContent='정지';
 timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('clock').textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;},1000);
 if(navigator.wakeLock){navigator.wakeLock.request('screen').catch(()=>{});}};
render();
</script>

</body>
</html>
